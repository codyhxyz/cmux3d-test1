name: CMUXGestures
options:
  bundleIdPrefix: com.codyhxyz
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CMUXGestures:
    type: application
    platform: iOS
    sources: Phone
    # ponytail: install both schemes directly while this is a prototype; embed the Watch app when shipping.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codyhxyz.cmuxgestures
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: CMUX Gestures
        NSCameraUsageDescription: CMUX Gestures uses the front camera to test hand gesture tracking.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  CMUXGesturesWatch:
    type: application
    platform: watchOS
    sources: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codyhxyz.cmuxgestures.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: CMUX Gestures
        WKCompanionAppBundleIdentifier: com.codyhxyz.cmuxgestures
  CMUXGesturesTests:
    type: bundle.unit-test
    platform: iOS
    sources: PhoneTests
    dependencies:
      - target: CMUXGestures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codyhxyz.cmuxgestures.tests
